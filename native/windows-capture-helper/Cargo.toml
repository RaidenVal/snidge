[package]
name = "snidge-wgc-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
windows-capture = "2.0.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_System_WinRT",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading"
] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
